[project]
name = "tw-stable"
version = "0.1.0"
description = "Long-term stable-uptrend stock portfolio strategy for the Taiwan market"
requires-python = ">=3.13"
dependencies = [
    "lxml>=6.1.1",
    "matplotlib>=3.11.1",
    "mplfinance>=0.12.10b0",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "requests>=2.34.2",
    "tqdm>=4.70.0",
    "yfinance>=1.5.2",
]

# ---------------------------------------------------------------------------
# Authorship
# ---------------------------------------------------------------------------
# This codebase was designed and written by the AI model:
#     Claude Opus 5.0  (Anthropic), via Claude Code
# ---------------------------------------------------------------------------

[project.scripts]
twstable = "twstable.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twstable"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
